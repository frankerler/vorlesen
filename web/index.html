<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesungen in Berlin</title>
<link rel="stylesheet" href="style.css?v=36">
</head>
<body>
  <svg class="diagonal-accent" aria-hidden="true" focusable="false">
    <line x1="0%" y1="100%" x2="100%" y2="0%" />
  </svg>

  <header class="site-header">
    <button id="suggest-btn" class="fab-add" title="Lesung vorschlagen" aria-label="Lesung vorschlagen">+</button>
    <h1 class="site-title"><span class="title-sans">Laut vorlesen</span><span class="title-serif">in Berlin</span></h1>
  </header>

  <div class="controls-bar" id="controls-bar">
    <div class="search-bar">
      <input type="search" id="search" placeholder="Suche nach Autor, Titel, Ort oder Verlag …" autocomplete="off">
      <span id="result-count" class="result-count"></span>
    </div>
    <nav class="quick-filters" id="quick-filters">
      <a href="?when=all" data-when="all">Alle</a>
      <a href="?when=today" data-when="today">Heute</a>
      <a href="?when=week" data-when="week">Nächste Woche</a>
      <a href="?when=month" data-when="month">Nächster Monat</a>
    </nav>
  </div>

  <main>
    <div id="list" class="event-list"></div>
    <p id="empty-state" class="empty-state" hidden>Keine Veranstaltungen gefunden.</p>
  </main>

  <div id="overlay" class="overlay detail-overlay" hidden>
    <div class="detail-panel" role="dialog" aria-modal="true">
      <button id="close-detail" class="back-btn" aria-label="Zurück">←</button>
      <button id="share-detail" class="share-btn" aria-label="Teilen" title="Teilen">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v13" />
          <path d="M7 8l5-5 5 5" />
          <path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6" />
        </svg>
      </button>
      <span id="share-feedback" class="share-feedback" role="status" aria-live="polite" hidden></span>
      <div id="detail-content"></div>
    </div>
  </div>

  <div id="suggest-overlay" class="overlay" hidden>
    <div class="detail-panel" role="dialog" aria-modal="true">
      <button id="close-suggest" class="close-btn" aria-label="Schließen">&times;</button>
      <h2>Lesung vorschlagen</h2>
      <p class="suggest-intro">
        Fehlt eine Lesung? Trag sie hier ein — wir prüfen deinen Vorschlag und
        nehmen ihn dann in die Liste auf. Kein Account nötig.
      </p>
      <form id="suggest-form">
        <label>Autor *<input type="text" name="author" required></label>
        <label>Buchtitel *<input type="text" name="book_title" required></label>
        <label>Veranstaltungsort *<input type="text" name="venue" required placeholder="z. B. Buchhandlung XY"></label>
        <label>Adresse<input type="text" name="address" placeholder="Straße, PLZ Berlin"></label>
        <div class="suggest-form-row">
          <label>Datum *<input type="date" name="date" required></label>
          <label>Uhrzeit<input type="time" name="time"></label>
        </div>
        <label>Link zur Veranstaltung<input type="url" name="url" placeholder="https://…"></label>
        <label>Anmerkungen<textarea name="notes" rows="3" placeholder="Verlag, Quelle, sonstige Hinweise …"></textarea></label>
        <button type="submit" class="detail-link suggest-submit">Vorschlag absenden →</button>
        <p id="suggest-status" class="suggest-status" hidden></p>
      </form>
    </div>
  </div>

  <!-- Floating pill that morphs in place into a small email-input tile,
       instead of opening a full modal like the suggest/detail overlays. -->
  <div class="newsletter-widget" id="newsletter-widget">
    <button type="button" id="newsletter-toggle" class="newsletter-toggle">Newsletter</button>
    <form id="newsletter-form" class="newsletter-form" hidden>
      <input type="hidden" name="_subject" value="Newsletter-Anmeldung">
      <input type="email" name="email" id="newsletter-email" class="newsletter-email" required placeholder="E-Mail-Adresse">
      <button type="submit" class="newsletter-submit" aria-label="Abonnieren">→</button>
      <button type="button" id="newsletter-close" class="newsletter-close" aria-label="Schließen">&times;</button>
    </form>
  </div>

  <script src="app.js?v=36"></script>

  <!-- Lightweight, cookie-free visit counter (GoatCounter -- free, privacy-
       friendly, no account needed by visitors). Replace REPLACE_ME with your
       own GoatCounter site code once you've signed up; see README.md. The
       admin page reads the same site's public counter to show a total. -->
  <script data-goatcounter="https://REPLACE_ME.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
